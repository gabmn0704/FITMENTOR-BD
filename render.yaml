# Blueprint for the FitMentor stack: FITMENTOR-BACKEND (Java 21 / Spring Boot) and
# FITMENTOR-IA (Python / FastAPI), each built from its own Dockerfile, plus PostgreSQL 16.
# The backend applies init.sql (bundled as db/schema.sql) on start and validates its JPA mapping.
services:
  - type: web
    name: fitmentor-backend
    runtime: docker
    repo: https://github.com/gabmn0704/FITMENTOR-BACKEND
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: 0.5c-512mb
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      # Production profile: PostgreSQL, schema applied on start, ddl-auto=validate.
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # Required in production: the backend refuses to start without it.
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed frontend origins (required in production).
      - key: FRONTEND_ORIGIN
        sync: false
      # OAuth client id used as the audience when verifying Google ID tokens.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_HOST
        fromDatabase:
          name: fitmentor-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: fitmentor-postgres
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: fitmentor-postgres
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: fitmentor-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fitmentor-postgres
          property: password
      # Render gives "host:port" without a scheme; the backend prefixes http:// for private services.
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: fitmentor-ai
          property: hostport
  - type: pserv
    name: fitmentor-ai
    runtime: docker
    repo: https://github.com/gabmn0704/FITMENTOR-IA
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: 0.5c-512mb
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: fitmentor-postgres
    databaseName: fitmentor
    user: fitmentor
    postgresMajorVersion: '16'
    region: ohio
    plan: 0.5c-1g
    connectionPool: pgbouncer
    ipAllowList: []